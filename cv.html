<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV — Julia Thomas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cv-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 20000;
            display: flex;
            flex-direction: column;
        }
        .cv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }
        .cv-viewer {
            flex: 1;
            width: 100%;
            border: none;
        }
        .cv-fallback {
            padding: 40px 20px;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
<div class="cv-page">
    <header class="cv-header">
        <a href="index.html" class="back-button">&larr; Back to Playground</a>
        <a href="content/CV_Julia_Thomas_EN.pdf" class="back-button" download>&darr; Download PDF</a>
    </header>
    <object class="cv-viewer" data="content/CV_Julia_Thomas_EN.pdf" type="application/pdf">
        <div class="cv-fallback">
            <p>Your browser can't display the PDF inline.</p>
            <p><a href="content/CV_Julia_Thomas_EN.pdf" class="back-button" download>&darr; Download CV (PDF)</a></p>
        </div>
    </object>
</div>
</body>
</html>
